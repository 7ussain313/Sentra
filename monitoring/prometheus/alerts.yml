groups:
  - name: sentra
    rules:
      - alert: OdooDown
        # Odoo's /web/health answers 200 even when PostgreSQL is gone, so a down
        # database must raise the same alert (pg_up comes from postgres_exporter).
        expr: (probe_success{job="odoo-health"} == 0) or (pg_up == 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Odoo or its database is not available"
          description: "{{ if $labels.instance }}HTTP probe of {{ $labels.instance }} has failed{{ else }}PostgreSQL is unreachable (pg_up=0){{ end }} for more than 1 minute."

      - alert: OdooHighLatency
        # Slow login page, or a login page that fails while the Odoo process itself is
        # up (blocked database, Python error in a module): /web/health does not see those.
        expr: >-
          (probe_duration_seconds{job="odoo-login"} > 2 and probe_success{job="odoo-login"} == 1)
          or
          (probe_success{job="odoo-login"} == 0 and on() probe_success{job="odoo-health"} == 1)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Odoo is slow or failing to serve pages"
          description: "Login page probe: {{ if eq (printf \"%.0f\" $value) \"0\" }}failing while Odoo is up{{ else }}takes {{ $value | humanizeDuration }} (threshold 2s){{ end }}."

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections are close to the limit"
          description: "{{ $value | humanizePercentage }} of max_connections is in use."

      # Source: the agent service's Docker-socket exporter (job "containers"),
      # which carries real container names on every host.
      - alert: ContainerMemoryHigh
        expr: sentra_container_memory_bytes > 1.5e9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} uses a lot of memory"
          description: "{{ $labels.name }} working set is {{ $value | humanize1024 }}B (threshold 1.5GiB)."
