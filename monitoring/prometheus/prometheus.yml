global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Odoo HTTP uptime and response time, probed from the outside by Blackbox.
  - job_name: odoo-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://odoo:8069/web/health"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # A real rendered page: this is what users feel, so latency is measured here.
  - job_name: odoo-login
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://odoo:8069/web/login"]
    relabel_configs: *blackbox_relabel

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Container state, restarts, memory and CPU with real container names.
  - job_name: containers
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    basic_auth:
      username: __UI_USERNAME__
      password_file: /tmp/agent_password
    static_configs:
      - targets: ["agents:8000"]

  # Host-level cgroup metrics; per-container series only on hosts where
  # cAdvisor can identify containers (Linux).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
