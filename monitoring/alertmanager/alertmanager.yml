# Rendered at container start: __UI_USERNAME__ is substituted from the environment,
# the password is read from a file written by the entrypoint (see docker-compose.yml).
route:
  receiver: sentra-agent
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: sentra-agent
    webhook_configs:
      - url: http://agents:8000/webhook/alertmanager
        send_resolved: true
        http_config:
          basic_auth:
            username: __UI_USERNAME__
            password_file: /tmp/webhook_password
