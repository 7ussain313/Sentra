[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
; db_user and db_password come from environment; admin_passwd is appended to a runtime copy of this file by docker-compose.yml
; logs go to stdout so `docker logs` works for the agent log tool
log_level = info
list_db = True
