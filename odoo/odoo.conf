[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
; db_user, db_password, admin_passwd are supplied via environment in docker-compose.yml
; logs go to stdout so `docker logs` works for the agent log tool
log_level = info
list_db = True
